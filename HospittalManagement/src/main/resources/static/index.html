<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart HMS - Secure Checkout</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-blue-950 min-h-screen flex items-center justify-center p-4">

<div class="max-w-md w-full glass-card rounded-2xl shadow-2xl p-8 transform transition-all">
    <!-- Header -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-full shadow-lg mb-4 text-2xl font-bold">
            🏥
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Hospital Appointment Payment</h1>
        <p class="text-sm text-slate-500 mt-1">Secure Gateway Powered by Smart HMS</p>
    </div>

    <!-- Payment Form -->
    <form id="paymentForm" onsubmit="handlePayment(event)" class="space-y-5">
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Appointment ID</label>
            <input type="number" id="appointmentId" required min="1" step="1" placeholder="e.g., 1"
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition text-slate-800 placeholder-slate-400 font-medium">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Amount (₹)</label>
            <input type="number" id="amount" required min="1" step="0.01" placeholder="e.g., 500.00"
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition text-slate-800 placeholder-slate-400 font-medium">
        </div>

        <button type="submit" id="payButton"
                class="w-full mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all duration-200 flex items-center justify-center space-x-2">
            <span id="buttonText">Proceed to Pay</span>
            <svg id="loadingSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </form>

    <!-- Status Box -->
    <div id="statusBox" class="hidden mt-6 p-4 rounded-xl text-center text-sm font-medium transition-all"></div>
</div>

<script>
    const API_BASE_URL = "https://smart-hms-yash.duckdns.org"; // Live AWS backend URL

    // Automatically load parameters from URL if present, otherwise keep inputs clean with placeholders
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const aptId = urlParams.get('appointmentId');
        const amt = urlParams.get('amount');

        if (aptId && parseInt(aptId) > 0) {
            document.getElementById('appointmentId').value = aptId;
        }
        if (amt && parseFloat(amt) > 0) {
            document.getElementById('amount').value = amt;
        }
    });

    async function handlePayment(event) {
        event.preventDefault();

        const appointmentId = document.getElementById('appointmentId').value;
        const amount = document.getElementById('amount').value;

        // Extra frontend safety check for negative or zero values
        if (parseInt(appointmentId) <= 0 || parseFloat(amount) <= 0) {
            alert("Appointment ID and Amount must be valid positive numbers!");
            return;
        }

        const payButton = document.getElementById('payButton');
        const buttonText = document.getElementById('buttonText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const statusBox = document.getElementById('statusBox');

        const token = localStorage.getItem('jwtToken') || sessionStorage.getItem('jwtToken');

        payButton.disabled = true;
        buttonText.innerText = "Creating Order...";
        loadingSpinner.classList.remove('hidden');
        statusBox.className = "hidden";

        try {
            // Call Create Order API
            const orderResponse = await fetch(`${API_BASE_URL}/payments/create-order`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                },
                body: JSON.stringify({ appointmentId: parseInt(appointmentId), amount: parseFloat(amount) })
            });

            if (!orderResponse.ok) throw new Error("Failed to create payment order. Unauthorized or invalid session.");
            const orderData = await orderResponse.json();

            buttonText.innerText = "Processing Payment...";
            await new Promise(resolve => setTimeout(resolve, 1500));

            buttonText.innerText = "Verifying Payment...";
            statusBox.className = "block p-4 rounded-xl text-center text-sm font-medium bg-amber-50 text-amber-800 border border-amber-200";
            statusBox.innerText = "Verifying payment with secure channel...";

            const verifyPayload = {
                appointmentId: parseInt(appointmentId),
                razorpayOrderId: orderData.razorpayOrderId,
                razorpayPaymentId: "pay_test_" + Math.floor(Math.random() * 1000000),
                razorpaySignature: "TEST_PASS"
            };

            // Call Verify Payment API
            const verifyResponse = await fetch(`${API_BASE_URL}/payments/verify`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                },
                body: JSON.stringify(verifyPayload)
            });

            if (!verifyResponse.ok) throw new Error("Payment verification failed.");

            // Success State
            statusBox.className = "block p-4 rounded-xl text-center text-sm font-medium bg-emerald-50 text-emerald-800 border border-emerald-200";
            statusBox.innerHTML = "🎉 <b>Payment Successful!</b> Appointment Confirmed. Redirecting...";

            buttonText.innerText = "Success! Redirecting...";
            payButton.className = "w-full mt-2 bg-emerald-600 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg";

            setTimeout(() => {
                window.location.href = `${API_BASE_URL}/doc`;
            }, 2000);

        } catch (error) {
            payButton.disabled = false;
            buttonText.innerText = "Proceed to Pay";
            loadingSpinner.classList.add('hidden');

            statusBox.className = "block p-4 rounded-xl text-center text-sm font-medium bg-rose-50 text-rose-800 border border-rose-200";
            statusBox.innerText = "❌ Error: " + error.message;
        }
    }
</script>
</body>
</html>
